# Base configuration. Precedence: CLI/init > environment (e.g. LLM__BACKEND) > .env > this file.
data_dir: data
seed: 13

llm:
  backend: ollama              # ollama (native /api/chat) | openai (any /v1 endpoint) | fake
  base_url: http://localhost:11434/v1
  extraction_model: qwen3:4b
  answer_model: qwen3:4b
  linking_model: qwen3:4b
  judge_model: qwen3:8b
  num_ctx: 8192
  temperature: 0.0
  think: false                 # Qwen3 thinking off for extraction/judging (DECISIONS.md)
  keep_alive: 2m
  timeout_s: 300
  cache_path: data/cache/llm_cache.sqlite

retrieval:                     # S1's rerank stage (DECISIONS.md D39-D41)
  reranker: bge                # bge-reranker-v2-m3, top 30 fused candidates
  rerank_top: 30
  second_reranker: null        # set to qwen with second_weight 0.5 for the recall-oriented
  second_weight: 0.0           #   blend (+0.018 held-out recall@8, ~2.8x retrieval latency)
  first_stage_weight: 0.0
